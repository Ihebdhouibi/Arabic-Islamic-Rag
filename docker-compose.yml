# Local development services for shamela-rag.
# Postgres holds relational/provenance data + source text; Qdrant holds dense + sparse vectors.
# Start:  docker compose up -d
# Stop:   docker compose down            (add -v to also drop the data volumes)
# Config is overridable via a local .env (see README "Local services").

services:
  postgres:
    image: postgres:16
    container_name: shamela-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shamela}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shamela}
      POSTGRES_DB: ${POSTGRES_DB:-shamela_rag}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shamela} -d ${POSTGRES_DB:-shamela_rag}"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.17.0
    container_name: shamela-qdrant
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:

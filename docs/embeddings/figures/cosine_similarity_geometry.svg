<svg viewBox="0 0 900 510" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="cs-arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/>
    </marker>
    <marker id="cs-arrow-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/>
    </marker>
  </defs>

  <rect width="900" height="510" fill="#fcfcfb"/>
  <rect x="1" y="1" width="898" height="508" fill="none" stroke="#e1e0d9" stroke-width="1"/>

  <text x="40" y="42" font-size="21" font-weight="600" fill="#0b0b0b">Cosine similarity: the geometry</text>
  <text x="40" y="65" font-size="13.5" fill="#52514e">Two embeddings are "similar" when the angle between them is small - magnitude usually doesn't matter.</text>

  <!-- Panel A -->
  <text x="60" y="108" font-size="14.5" font-weight="600" fill="#0b0b0b">Raw vectors</text>
  <rect x="40" y="120" width="400" height="290" rx="8" fill="#ffffff" stroke="#e1e0d9" stroke-width="1"/>

  <!-- axes -->
  <line x1="230" y1="120" x2="230" y2="410" stroke="#e1e0d9" stroke-width="1"/>
  <line x1="40" y1="370" x2="440" y2="370" stroke="#e1e0d9" stroke-width="1"/>

  <!-- angle arc -->
  <path d="M 260 356 A 34 34 0 0 0 253 331" fill="none" stroke="#898781" stroke-width="1.5"/>
  <text x="270" y="345" font-size="13" fill="#52514e">&#952;</text>

  <!-- vectors -->
  <line x1="230" y1="370" x2="280" y2="120" stroke="#2a78d6" stroke-width="2.5" marker-end="url(#cs-arrow-a)"/>
  <line x1="230" y1="370" x2="410" y2="260" stroke="#eb6834" stroke-width="2.5" marker-end="url(#cs-arrow-b)"/>

  <text x="285" y="115" font-size="13" font-weight="600" fill="#2a78d6">A</text>
  <text x="415" y="258" font-size="13" font-weight="600" fill="#eb6834">B</text>

  <text x="60" y="430" font-size="13" fill="#0b0b0b" font-weight="600">cos &#952; = (A &#183; B) / (|A| |B|)</text>

  <!-- Panel B -->
  <text x="480" y="108" font-size="14.5" font-weight="600" fill="#0b0b0b">After L2 normalization</text>
  <rect x="460" y="120" width="400" height="290" rx="8" fill="#ffffff" stroke="#e1e0d9" stroke-width="1"/>

  <circle cx="680" cy="270" r="140" fill="none" stroke="#898781" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="680" y1="120" x2="680" y2="410" stroke="#e1e0d9" stroke-width="1"/>
  <line x1="540" y1="270" x2="820" y2="270" stroke="#e1e0d9" stroke-width="1"/>

  <line x1="680" y1="270" x2="707" y2="133" stroke="#2a78d6" stroke-width="2.5" marker-end="url(#cs-arrow-a)"/>
  <line x1="680" y1="270" x2="799" y2="197" stroke="#eb6834" stroke-width="2.5" marker-end="url(#cs-arrow-b)"/>

  <text x="712" y="130" font-size="13" font-weight="600" fill="#2a78d6">A (unit length)</text>
  <text x="804" y="192" font-size="13" font-weight="600" fill="#eb6834">B (unit length)</text>

  <text x="480" y="430" font-size="13" fill="#0b0b0b" font-weight="600">Same angle &#952;, both length 1 &#8594; cos &#952; = A &#183; B directly</text>

  <!-- legend / scale -->
  <rect x="40" y="450" width="820" height="48" rx="6" fill="#f9f9f7" stroke="#e1e0d9"/>
  <circle cx="66" cy="474" r="7" fill="#2a78d6"/>
  <text x="80" y="479" font-size="12" fill="#52514e">cos &#952; &#8776; 1: nearly identical meaning</text>
  <circle cx="380" cy="474" r="7" fill="#898781"/>
  <text x="394" y="479" font-size="12" fill="#52514e">cos &#952; &#8776; 0: unrelated</text>
  <circle cx="600" cy="474" r="7" fill="#d03b3b"/>
  <text x="614" y="479" font-size="12" fill="#52514e">cos &#952; &#8776; -1: opposite (rare for text)</text>
</svg>

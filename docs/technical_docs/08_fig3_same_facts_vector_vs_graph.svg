<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="f3-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
  </defs>

  <rect width="900" height="480" fill="#fcfcfb"/>
  <rect x="1" y="1" width="898" height="478" fill="none" stroke="#e1e0d9" stroke-width="1"/>

  <text x="40" y="42" font-size="21" font-weight="600" fill="#0b0b0b">Same facts, two models</text>
  <text x="40" y="65" font-size="13.5" fill="#52514e">Narrator A really did narrate from Narrator B in both views below — only one of them says so explicitly.</text>

  <line x1="450" y1="90" x2="450" y2="412" stroke="#e1e0d9" stroke-width="1"/>

  <!-- LEFT: vector store view -->
  <text x="60" y="112" font-size="14.5" font-weight="600" fill="#0b0b0b">Vector store view</text>
  <rect x="40" y="128" width="380" height="250" rx="8" fill="#ffffff" stroke="#e1e0d9" stroke-width="1"/>

  <line x1="110" y1="190" x2="330" y2="330" stroke="#d03b3b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="212" y1="252" x2="228" y2="268" stroke="#d03b3b" stroke-width="2"/>
  <line x1="228" y1="252" x2="212" y2="268" stroke="#d03b3b" stroke-width="2"/>
  <text x="150" y="240" font-size="11.5" fill="#d03b3b">embedding distance: far</text>

  <circle cx="110" cy="190" r="9" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
  <text x="110" y="172" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">Narrator A</text>
  <text x="110" y="215" font-size="10.5" fill="#898781" text-anchor="middle">biography text</text>

  <circle cx="330" cy="330" r="9" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
  <text x="330" y="352" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">Narrator B</text>
  <text x="330" y="309" font-size="10.5" fill="#898781" text-anchor="middle">biography text</text>

  <text x="60" y="398" font-size="12" fill="#52514e">Two related people, embedded far apart —</text>
  <text x="60" y="412" font-size="12" fill="#52514e">biographies just don't read as similar text.</text>

  <!-- RIGHT: knowledge graph view -->
  <text x="510" y="112" font-size="14.5" font-weight="600" fill="#0b0b0b">Knowledge graph view</text>

  <line x1="594" y1="253" x2="786" y2="253" stroke="#52514e" stroke-width="2" marker-end="url(#f3-arrow)"/>
  <text x="638" y="238" font-size="12" fill="#52514e" font-weight="600">NARRATED_FROM</text>

  <circle cx="560" cy="253" r="34" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
  <text x="560" y="310" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">Narrator A</text>

  <circle cx="820" cy="253" r="34" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
  <text x="820" y="310" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">Narrator B</text>

  <text x="510" y="398" font-size="12" fill="#52514e">Same two people — the graph states the</text>
  <text x="510" y="412" font-size="12" fill="#52514e">relationship directly, regardless of the text.</text>

  <!-- shared caption -->
  <rect x="40" y="424" width="820" height="46" rx="6" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="56" y="452" font-size="12.5" fill="#52514e">Vector similarity approximates relatedness through text similarity and can miss it; a graph states relatedness directly.</text>
</svg>

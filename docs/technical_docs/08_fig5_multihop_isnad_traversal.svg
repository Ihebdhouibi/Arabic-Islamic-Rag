<svg viewBox="0 0 1050 420" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="f5-arrow-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0ca30c"/>
    </marker>
    <marker id="f5-arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d03b3b"/>
    </marker>
  </defs>

  <rect width="1050" height="420" fill="#fcfcfb"/>
  <rect x="1" y="1" width="1048" height="418" fill="none" stroke="#e1e0d9" stroke-width="1"/>

  <text x="40" y="42" font-size="21" font-weight="600" fill="#0b0b0b">Multi-hop traversal: walking an isnad chain</text>
  <text x="40" y="64" font-size="13.5" fill="#52514e">A graph can walk every link in order and flag the weak one — a vector index has no native way to do either.</text>

  <!-- edges -->
  <line x1="148" y1="200" x2="282" y2="200" stroke="#0ca30c" stroke-width="2.5" marker-end="url(#f5-arrow-good)"/>
  <line x1="358" y1="200" x2="492" y2="200" stroke="#d03b3b" stroke-width="3" marker-end="url(#f5-arrow-bad)"/>
  <line x1="568" y1="200" x2="702" y2="200" stroke="#0ca30c" stroke-width="2.5" marker-end="url(#f5-arrow-good)"/>
  <line x1="778" y1="200" x2="912" y2="200" stroke="#0ca30c" stroke-width="2.5" marker-end="url(#f5-arrow-good)"/>

  <!-- edge labels -->
  <text x="215" y="183" font-size="11" fill="#0b0b0b" text-anchor="middle">NARRATED_FROM</text>
  <text x="425" y="183" font-size="11" fill="#0b0b0b" text-anchor="middle">NARRATED_FROM</text>
  <text x="635" y="183" font-size="11" fill="#0b0b0b" text-anchor="middle">NARRATED_FROM</text>
  <text x="845" y="183" font-size="11" fill="#0b0b0b" text-anchor="middle">NARRATED_FROM</text>

  <!-- grading pills -->
  <rect x="185" y="211" width="60" height="22" rx="11" fill="#0ca30c"/>
  <text x="215" y="226" font-size="11" fill="#ffffff" text-anchor="middle">thiqa</text>

  <rect x="395" y="211" width="60" height="22" rx="11" fill="#d03b3b"/>
  <text x="425" y="226" font-size="11" fill="#ffffff" text-anchor="middle">da'if</text>

  <rect x="605" y="211" width="60" height="22" rx="11" fill="#0ca30c"/>
  <text x="635" y="226" font-size="11" fill="#ffffff" text-anchor="middle">thiqa</text>

  <rect x="815" y="211" width="60" height="22" rx="11" fill="#0ca30c"/>
  <text x="845" y="226" font-size="11" fill="#ffffff" text-anchor="middle">thiqa</text>

  <!-- nodes -->
  <circle cx="110" cy="200" r="38" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
  <text x="110" y="262" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">Al-Bukhari</text>
  <text x="110" y="278" font-size="10.5" fill="#898781" text-anchor="middle">compiler</text>

  <circle cx="320" cy="200" r="38" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
  <text x="320" y="262" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">Ahmad ibn Hanbal</text>
  <text x="320" y="278" font-size="10.5" fill="#898781" text-anchor="middle">narrator</text>

  <circle cx="530" cy="200" r="38" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
  <circle cx="530" cy="200" r="43" fill="none" stroke="#d03b3b" stroke-width="3"/>
  <text x="530" y="262" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">Ibn Lahi'a</text>
  <text x="530" y="278" font-size="10.5" fill="#d03b3b" text-anchor="middle">narrator — flagged</text>

  <circle cx="740" cy="200" r="38" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
  <text x="740" y="262" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">Az-Zuhri</text>
  <text x="740" y="278" font-size="10.5" fill="#898781" text-anchor="middle">narrator</text>

  <circle cx="950" cy="200" r="38" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
  <text x="950" y="262" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">Sa'id ibn al-Musayyib</text>
  <text x="950" y="278" font-size="10.5" fill="#898781" text-anchor="middle">earliest source</text>

  <!-- leader to callout -->
  <line x1="425" y1="233" x2="425" y2="300" stroke="#d03b3b" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- callout -->
  <rect x="140" y="300" width="650" height="55" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <rect x="140" y="300" width="6" height="55" fill="#d03b3b"/>
  <text x="166" y="322" font-size="12" fill="#0b0b0b">Vector search over "chunks about Ahmad's teachers" can't guarantee it walks this exact</text>
  <text x="166" y="340" font-size="12" fill="#0b0b0b">chain, in order — a graph traversal can, and flags the da'if link automatically.</text>

  <!-- legend -->
  <rect x="140" y="378" width="46" height="18" rx="9" fill="#0ca30c"/>
  <text x="196" y="391" font-size="12" fill="#52514e">graded ثقة (trustworthy)</text>
  <rect x="420" y="378" width="46" height="18" rx="9" fill="#d03b3b"/>
  <text x="476" y="391" font-size="12" fill="#52514e">graded ضعيف (weak) — breaks isnad reliability</text>
</svg>

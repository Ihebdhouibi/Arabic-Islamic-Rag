<svg viewBox="0 0 1100 870" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="f4-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
  </defs>

  <rect width="1100" height="870" fill="#fcfcfb"/>
  <rect x="1" y="1" width="1098" height="868" fill="none" stroke="#e1e0d9" stroke-width="1"/>

  <text x="40" y="42" font-size="21" font-weight="600" fill="#0b0b0b">Hybrid retrieval architecture: one router, four paths</text>
  <text x="40" y="64" font-size="13.5" fill="#52514e">How the four confirmed use cases map to different retrieval mechanics before converging on one generation step.</text>

  <!-- Row 1: user question -->
  <rect x="420" y="90" width="260" height="50" rx="8" fill="#ffffff" stroke="#0b0b0b" stroke-width="2"/>
  <text x="550" y="120" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle">User question</text>

  <line x1="550" y1="140" x2="550" y2="158" stroke="#52514e" stroke-width="2" marker-end="url(#f4-arrow)"/>

  <!-- Router diamond -->
  <polygon points="550,160 700,225 550,290 400,225" fill="#ffffff" stroke="#0b0b0b" stroke-width="2"/>
  <text x="550" y="221" font-size="13.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">Query router</text>
  <text x="550" y="238" font-size="10.5" fill="#52514e" text-anchor="middle">rules + intent classifier</text>

  <!-- Router fan-out arrows -->
  <line x1="550" y1="290" x2="190" y2="338" stroke="#52514e" stroke-width="1.5" marker-end="url(#f4-arrow)"/>
  <line x1="550" y1="290" x2="430" y2="338" stroke="#52514e" stroke-width="1.5" marker-end="url(#f4-arrow)"/>
  <line x1="550" y1="290" x2="670" y2="338" stroke="#52514e" stroke-width="1.5" marker-end="url(#f4-arrow)"/>
  <line x1="550" y1="290" x2="910" y2="338" stroke="#52514e" stroke-width="1.5" marker-end="url(#f4-arrow)"/>

  <!-- Row 3: four lanes -->
  <rect x="80" y="340" width="220" height="72" rx="8" fill="#ffffff" stroke="#e1e0d9" stroke-width="1"/>
  <rect x="80" y="340" width="6" height="72" fill="#2a78d6"/>
  <text x="102" y="365" font-size="13.5" font-weight="600" fill="#0b0b0b">Hadith takhrij</text>
  <text x="102" y="383" font-size="11" fill="#52514e">Graph traversal:</text>
  <text x="102" y="398" font-size="11" fill="#52514e">hadith_xrefs → isnad chain</text>

  <rect x="320" y="340" width="220" height="72" rx="8" fill="#ffffff" stroke="#e1e0d9" stroke-width="1"/>
  <rect x="320" y="340" width="6" height="72" fill="#1baf7a"/>
  <text x="342" y="365" font-size="13.5" font-weight="600" fill="#0b0b0b">Tafsir by verse</text>
  <text x="342" y="383" font-size="11" fill="#52514e">Exact lookup:</text>
  <text x="342" y="398" font-size="11" fill="#52514e">tafsir_xrefs → verse join</text>

  <rect x="560" y="340" width="220" height="72" rx="8" fill="#ffffff" stroke="#e1e0d9" stroke-width="1"/>
  <rect x="560" y="340" width="6" height="72" fill="#eb6834"/>
  <text x="582" y="365" font-size="13.5" font-weight="600" fill="#0b0b0b">Fiqh ruling</text>
  <text x="582" y="383" font-size="11" fill="#52514e">Hybrid dense+lexical,</text>
  <text x="582" y="398" font-size="11" fill="#52514e">filtered by madhhab/era</text>

  <rect x="800" y="340" width="220" height="72" rx="8" fill="#ffffff" stroke="#e1e0d9" stroke-width="1"/>
  <rect x="800" y="340" width="6" height="72" fill="#4a3aa7"/>
  <text x="822" y="365" font-size="13.5" font-weight="600" fill="#0b0b0b">General Q&amp;A</text>
  <text x="822" y="383" font-size="11" fill="#52514e">Hybrid dense+lexical,</text>
  <text x="822" y="398" font-size="11" fill="#52514e">TOC-anchored chunks</text>

  <!-- Converge to enrichment -->
  <line x1="190" y1="412" x2="500" y2="458" stroke="#52514e" stroke-width="1.5" marker-end="url(#f4-arrow)"/>
  <line x1="430" y1="412" x2="530" y2="458" stroke="#52514e" stroke-width="1.5" marker-end="url(#f4-arrow)"/>
  <line x1="670" y1="412" x2="570" y2="458" stroke="#52514e" stroke-width="1.5" marker-end="url(#f4-arrow)"/>
  <line x1="910" y1="412" x2="600" y2="458" stroke="#52514e" stroke-width="1.5" marker-end="url(#f4-arrow)"/>

  <!-- Row 4: enrichment -->
  <rect x="290" y="460" width="520" height="62" rx="8" fill="#f4f3f0" stroke="#0b0b0b" stroke-width="1.5"/>
  <text x="550" y="486" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle">Graph-augmented enrichment</text>
  <text x="550" y="503" font-size="11" fill="#52514e" text-anchor="middle">pull narrator bios + jarh-wa-ta'dil + cross-references into context — any path</text>

  <line x1="550" y1="522" x2="550" y2="558" stroke="#52514e" stroke-width="2" marker-end="url(#f4-arrow)"/>

  <!-- Row 5: rerank -->
  <rect x="360" y="560" width="380" height="55" rx="8" fill="#ffffff" stroke="#e1e0d9" stroke-width="1"/>
  <text x="550" y="583" font-size="13.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">Cross-encoder rerank</text>
  <text x="550" y="600" font-size="11" fill="#52514e" text-anchor="middle">candidates → top-5, lost-in-the-middle reordering</text>

  <line x1="550" y1="615" x2="550" y2="653" stroke="#52514e" stroke-width="2" marker-end="url(#f4-arrow)"/>

  <!-- Row 6: generation -->
  <rect x="320" y="655" width="460" height="70" rx="8" fill="#ffffff" stroke="#0b0b0b" stroke-width="2"/>
  <text x="550" y="681" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle">LLM generation</text>
  <text x="550" y="698" font-size="11" fill="#52514e" text-anchor="middle">mandatory citations</text>
  <text x="550" y="713" font-size="11" fill="#52514e" text-anchor="middle">disagreement (ikhtilaf) preserved, not flattened</text>

  <line x1="550" y1="725" x2="550" y2="758" stroke="#52514e" stroke-width="2" marker-end="url(#f4-arrow)"/>

  <!-- Row 7: answer -->
  <rect x="270" y="760" width="560" height="55" rx="8" fill="#f4f3f0" stroke="#e1e0d9" stroke-width="1"/>
  <text x="550" y="782" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">Answer: cited passages, grouped by madhhab/mufassir where relevant</text>
  <text x="550" y="800" font-size="10.5" fill="#898781" text-anchor="middle">book · author · page / hadith reference always attached</text>

  <!-- Legend -->
  <rect x="80" y="826" width="16" height="16" fill="#2a78d6"/>
  <text x="102" y="839" font-size="11.5" fill="#52514e">Hadith path</text>
  <rect x="220" y="826" width="16" height="16" fill="#1baf7a"/>
  <text x="242" y="839" font-size="11.5" fill="#52514e">Tafsir path</text>
  <rect x="360" y="826" width="16" height="16" fill="#eb6834"/>
  <text x="382" y="839" font-size="11.5" fill="#52514e">Fiqh path</text>
  <rect x="500" y="826" width="16" height="16" fill="#4a3aa7"/>
  <text x="522" y="839" font-size="11.5" fill="#52514e">General Q&amp;A path</text>
</svg>
